services:
  db:
    image: postgres:16-alpine
    container_name: shifty_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shifty_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shifty_password}
      POSTGRES_DB: ${POSTGRES_DB:-shifty_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: shifty_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shifty_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shifty}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-shifty_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shifty_backend
    restart: always
    environment:
      ENV: ${ENV:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Sin default: un secreto de firma publicado en el repo permite forjar
      # tokens. Genera uno con: openssl rand -hex 32 (ver .env.example).
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env (openssl rand -hex 32)}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Falta FIELD_ENCRYPTION_KEY en .env (openssl rand -hex 32)}
      # La app usa un rol sin superusuario para que RLS la alcance.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-shifty_app}:${APP_DB_PASSWORD:-shifty_app_password}@db:5432/${POSTGRES_DB:-shifty_db}
      # Las migraciones necesitan DDL: van con el dueno de la base.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shifty_user}:${POSTGRES_PASSWORD:-shifty_password}@db:5432/${POSTGRES_DB:-shifty_db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-shifty_app_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-shifty}:${RABBITMQ_DEFAULT_PASS:-shifty_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/1
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
      MERCADOPAGO_OAUTH_CLIENT_ID: ${MERCADOPAGO_OAUTH_CLIENT_ID:-}
      MERCADOPAGO_OAUTH_CLIENT_SECRET: ${MERCADOPAGO_OAUTH_CLIENT_SECRET:-}
      MERCADOPAGO_OAUTH_REDIRECT_URI: ${MERCADOPAGO_OAUTH_REDIRECT_URI:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
      OTP_PROVIDER: ${OTP_PROVIDER:-console}
      OTP_DEBUG_EXPOSE_CODE: ${OTP_DEBUG_EXPOSE_CODE:-true}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-user}
      SMTP_PASS: ${SMTP_PASS:-pass}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-no-reply@localhost}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-32768}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-240}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-12}
      RATE_LIMIT_PUBLIC_READ_PER_MINUTE: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:-120}
      RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE: ${RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE:-20}
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 512M

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A core.celery_app worker --loglevel=info
    container_name: shifty_celery
    restart: always
    environment:
      # La app usa un rol sin superusuario para que RLS la alcance.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-shifty_app}:${APP_DB_PASSWORD:-shifty_app_password}@db:5432/${POSTGRES_DB:-shifty_db}
      # Las migraciones necesitan DDL: van con el dueno de la base.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shifty_user}:${POSTGRES_PASSWORD:-shifty_password}@db:5432/${POSTGRES_DB:-shifty_db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-shifty_app_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-shifty}:${RABBITMQ_DEFAULT_PASS:-shifty_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/1
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 512M

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A core.celery_app beat --loglevel=info
    container_name: shifty_celery_beat
    restart: always
    environment:
      # La app usa un rol sin superusuario para que RLS la alcance.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-shifty_app}:${APP_DB_PASSWORD:-shifty_app_password}@db:5432/${POSTGRES_DB:-shifty_db}
      # Las migraciones necesitan DDL: van con el dueno de la base.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shifty_user}:${POSTGRES_PASSWORD:-shifty_password}@db:5432/${POSTGRES_DB:-shifty_db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-shifty_app_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-shifty}:${RABBITMQ_DEFAULT_PASS:-shifty_password}@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/1
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: shifty_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: shifty_nginx
    restart: always
    ports:
      - "80:80"
      # 443 se publica desde el override de produccion, junto con los
      # certificados TLS (nginx/nginx.prod.conf). Publicarlo sin TLS detras
      # era un puerto muerto que aparentaba HTTPS.
    depends_on:
      - backend
      - frontend
    networks:
      - shifty_network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  shifty_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
