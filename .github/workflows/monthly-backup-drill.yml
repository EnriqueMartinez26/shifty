name: Monthly Backup Restore Drill

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run backup/restore drill
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
        run: |
          uv run python scripts/backup_restore_drill.py \
            --backup-dir ../backups \
            --evidence-dir ../backups/evidence \
            --run-backup \
            --run-restore

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-evidence
          path: |
            backups/evidence/*.json
            backups/*.sha256
