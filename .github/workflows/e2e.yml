name: E2E (reserva multi-servicio aislada)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e.yml'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'docker-compose.e2e.yml'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/application/services/PublicBookingService.ts'
      - 'frontend/src/presentation/components/organisms/booking/**'

permissions:
  contents: read

env:
  NODE_VERSION: '26.5.0'
  NPM_VERSION: '11.17.0'
  E2E_ISOLATED_RUN_ID: '${{ github.run_id }}-${{ github.run_attempt }}'
  E2E_COMPOSE_PROJECT: 'shifty-qa-${{ github.run_id }}-${{ github.run_attempt }}'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run against newly provisioned disposable stack
        run: npm run e2e:isolated
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Remove isolated project and volumes
        if: always()
        working-directory: .
        shell: bash
        run: |
          env_file="${RUNNER_TEMP}/${E2E_COMPOSE_PROJECT}.env"
          if [[ -f "$env_file" ]]; then
            docker compose \
              --project-name "$E2E_COMPOSE_PROJECT" \
              --env-file "$env_file" \
              -f docker-compose.yml \
              -f docker-compose.e2e.yml \
              down --volumes --remove-orphans >/dev/null
            rm -f -- "$env_file"
          fi
