name: CodeQL

# Analisis estatico de seguridad (SAST) nativo de GitHub para el backend
# (Python) y el frontend (TypeScript). Los hallazgos van a la pestana Security
# del repo; empieza en modo aviso (no bloquea el merge todavia). El escaneo de
# secretos vive en el job secret-scan de quality.yml.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Un barrido semanal detecta reglas nuevas sobre codigo que no cambio.
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            paths: backend
          - language: javascript-typescript
            paths: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended agrega consultas de seguridad de mayor cobertura.
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
