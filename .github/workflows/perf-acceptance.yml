name: Perf Acceptance

# Prueba de aceptacion de capacidad (plan de correccion §9, plan-capacidad §5):
# 150 clientes + 45 duenos + 5 superadmin contra STAGING, rampa de 5 min y 20
# de meseta, con una rafaga sobre el mismo slot cada 5 min. Locust deja el CSV
# y scripts/perf_acceptance_check.py decide: p95 < 500 ms por ruta, 0 5xx,
# 0 429, rafagas 1 x 201 + 409, outbox al dia. docs/PERF_ACCEPTANCE.md.
#
# No ejecutar hasta que el Environment `staging` tenga revisión requerida y la
# infraestructura esté aislada. PERF_STAGING_ISOLATED y
# PERF_RUNNER_EGRESS_RESTRICTED son atestaciones operativas, no pruebas
# automáticas. El nocturno queda apagado hasta PERF_NIGHTLY=true.
#
# Solo corre en el grupo de runners dedicado `shifty-perf-staging`, sin fallback
# a runners alojados por GitHub. Ver docs/PERF_ACCEPTANCE.md para configurar y
# comprobar el grupo y la protección del Environment antes de habilitarlo.
#
# Antes del manifiesto, de Locust y de cualquier request a la API, el paso
# "Verificar destino de staging" corre scripts/verify_perf_target.py: origen
# HTTPS exacto (PERF_ALLOWED_ORIGIN), produccion rechazada, readiness con
# `environment: staging` y sin redirecciones. Falla cerrado.

on:
  schedule:
    # 06:30 UTC = 03:30 ART, fuera del horario de reservas.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      network_offset_ms:
        description: "Latencia medida que se suma al umbral (0-150 ms)"
        required: false
        default: ""

# El token de GitHub solo lee el repo: el job maneja secretos de staging.
permissions:
  contents: read

concurrency:
  group: perf-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && vars.PERF_NIGHTLY == 'true')
    runs-on:
      group: shifty-perf-staging
      labels: [self-hosted, linux, x64]
    environment:
      name: staging
      deployment: false
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    env:
      NETWORK_OFFSET_MS: ${{ inputs.network_offset_ms || vars.PERF_NETWORK_OFFSET_MS || '0' }}
      PERF_ALLOWED_ORIGIN: ${{ vars.PERF_ALLOWED_ORIGIN }}
    steps:
      - name: Verificar aislamiento y egress del staging
        working-directory: .
        env:
          PERF_ALLOWED_ORIGIN: ${{ vars.PERF_ALLOWED_ORIGIN }}
          PERF_STAGING_ISOLATED: ${{ vars.PERF_STAGING_ISOLATED }}
          PERF_RUNNER_EGRESS_RESTRICTED: ${{ vars.PERF_RUNNER_EGRESS_RESTRICTED }}
        run: |
          fallo=0
          if [ "$PERF_STAGING_ISOLATED" != "true" ]; then
            echo "::error title=Staging sin aislamiento verificado::Configure PERF_STAGING_ISOLATED=true en el Environment staging solo despues de comprobar el aislamiento de servicios y datos respecto de produccion."
            fallo=1
          fi
          if [ "$PERF_RUNNER_EGRESS_RESTRICTED" != "true" ]; then
            echo "::error title=Runner sin egress verificado::Configure PERF_RUNNER_EGRESS_RESTRICTED=true en el Environment staging solo despues de probar las reglas allow/deny desde el runner dedicado."
            fallo=1
          fi
          if [ -z "$PERF_ALLOWED_ORIGIN" ]; then
            echo "::error title=Falta el origen aprobado::Configure PERF_ALLOWED_ORIGIN en el Environment staging."
            fallo=1
          fi
          exit "$fallo"

      - name: Verificar configuracion de la prueba
        working-directory: .
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
          SHIFTY_SUPERADMIN_EMAIL: ${{ secrets.SHIFTY_SUPERADMIN_EMAIL }}
          SHIFTY_SUPERADMIN_PASSWORD: ${{ secrets.SHIFTY_SUPERADMIN_PASSWORD }}
        run: |
          faltan=""
          [ -n "$STAGING_URL" ] || faltan="$faltan STAGING_URL"
          [ -n "$SEED_OWNER_PASSWORD" ] || faltan="$faltan SEED_OWNER_PASSWORD"
          [ -n "$SHIFTY_SUPERADMIN_EMAIL" ] || faltan="$faltan SHIFTY_SUPERADMIN_EMAIL"
          [ -n "$SHIFTY_SUPERADMIN_PASSWORD" ] || faltan="$faltan SHIFTY_SUPERADMIN_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "::error title=Prueba de aceptacion sin configurar::Faltan los secretos del Environment staging:$faltan. STAGING_URL = URL de la API de STAGING con /api (nunca produccion); SEED_OWNER_PASSWORD = la clave con la que se corrio scripts/seed_capacidad.py; SHIFTY_SUPERADMIN_* = un superadmin de staging (muestrea /ops/slo). Ver docs/PERF_ACCEPTANCE.md."
            exit 1
          fi
          if [ -z "$PERF_ALLOWED_ORIGIN" ]; then
            echo "::error title=Prueba de aceptacion sin configurar::Falta PERF_ALLOWED_ORIGIN en el Environment staging. Ver docs/PERF_ACCEPTANCE.md."
            exit 1
          fi
          case "$PERF_ALLOWED_ORIGIN" in
            https://*) ;;
            *)
              echo "::error title=Origen no permitido::PERF_ALLOWED_ORIGIN debe ser el origen HTTPS exacto de staging. Ver docs/PERF_ACCEPTANCE.md."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Locust y las dependencias corren despues: el token no queda en .git.
          persist-credentials: false

      - name: Setup Python y uv
        uses: ./.github/actions/setup-python-uv

      - name: Install dependencies
        # Locust ya esta en el grupo dev del lock: no es dependencia nueva.
        run: uv sync --frozen

      - name: Verificar destino de staging
        # Preflight obligatorio (#155): sin `if` ni `continue-on-error`, antes
        # de cualquier request de carga. Solo recibe la URL; las claves no.
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: uv run python scripts/verify_perf_target.py

      - name: Manifiesto de tiendas desde staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          uv run python loadtests/aceptacion.py \
            --host "$STAGING_URL" --stores 200 --out "$RUNNER_TEMP/perf/manifiesto.json"

      - name: Locust (rampa 5 min + meseta 20 min)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
          SHIFTY_SUPERADMIN_EMAIL: ${{ secrets.SHIFTY_SUPERADMIN_EMAIL }}
          SHIFTY_SUPERADMIN_PASSWORD: ${{ secrets.SHIFTY_SUPERADMIN_PASSWORD }}
          SHIFTY_MANIFEST: ${{ runner.temp }}/perf/manifiesto.json
          # Escenario completo fijo: el veredicto exige 4 rafagas y 24 min de
          # muestras, y el entorno del runner no puede acortarlo.
          SHIFTY_USUARIOS: "200"
          SHIFTY_RAMPA_S: "300"
          SHIFTY_MESETA_S: "1200"
          SHIFTY_RAFAGA_CADA_S: "300"
          SHIFTY_THINK_SCALE: "1"
        # Locust sale distinto de cero con cualquier falla de request. El paso
        # no corta aca: el veredicto juzga el CSV y ese codigo juntos, y
        # rechaza un codigo distinto de cero.
        run: |
          set +e
          uv run locust -f loadtests/locust_aceptacion.py --headless \
            --host "$STAGING_URL" --csv "$RUNNER_TEMP/perf/aceptacion" --only-summary
          locust_exit_code=$?
          set -e
          printf 'LOCUST_EXIT_CODE=%s\n' "$locust_exit_code" >> "$GITHUB_ENV"
          echo "locust termino con codigo $locust_exit_code"

      - name: Veredicto
        run: |
          uv run python scripts/perf_acceptance_check.py \
            --csv-prefix "$RUNNER_TEMP/perf/aceptacion" \
            --locust-exit-code "$LOCUST_EXIT_CODE" \
            --network-offset-ms "$NETWORK_OFFSET_MS"

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-acceptance
          path: ${{ runner.temp }}/perf/
