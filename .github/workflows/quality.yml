name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "26.5.0"
  NPM_VERSION: "11.17.0"
  NODE_COMPAT_VERSION: "24.18.0"
  NPM_COMPAT_VERSION: "11.16.0"
  PYTHON_VERSION: "3.14.6"
  UV_VERSION: "0.11.29"

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    needs: [standards, contract-and-migrations]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        # Tolerancia cero para dependencias de PRODUCCION (lo que llega al usuario).
        # Se excluye --omit=dev: las vulnerabilidades del toolchain de dev
        # (eslint/jest -> minimatch -> brace-expansion) no se despachan y hoy no
        # tienen fix sin romper el build. Revisar si aparece fix upstream.
        run: npm audit --omit=dev --audit-level=low
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:strict
      - name: Test with coverage
        run: npm run test:coverage -- --watchAll=false
      - name: Build
        run: npm run build

  frontend-node24-compat:
    runs-on: ubuntu-latest
    needs: [standards, contract-and-migrations]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node 24 compatibility lane
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_COMPAT_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup npm compatibility version
        run: npm install --global "npm@${NPM_COMPAT_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Run strict checks
        run: npm run check
      - name: Test with coverage
        run: npm run test:coverage -- --watchAll=false
      - name: Build
        run: npm run build

  backend-quality:
    runs-on: ubuntu-latest
    needs: [standards, contract-and-migrations]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .
      - name: Test
        run: uv run pytest

  contract-and-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Import FastAPI app and generate OpenAPI
        run: uv run python -c "from main import app; app.openapi()"
      - name: Validate Alembic migration graph
        run: uv run alembic heads

  backend-integration:
    runs-on: ubuntu-latest
    needs: [standards, contract-and-migrations]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run integration tests
        run: uv run pytest tests/integration

  standards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup npm
        working-directory: frontend
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Check frontend standards
        working-directory: frontend
        run: npm run check
      - name: Check backend standards
        working-directory: backend
        run: uv run ruff format --check . && uv run ruff check . && uv run mypy .

  dead-code:
    runs-on: ubuntu-latest
    needs: [standards]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup npm
        working-directory: frontend
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Backend unused imports and redefinitions
        working-directory: backend
        run: uv run ruff check --select F401,F811 .
      - name: Frontend unused exports and variables
        working-directory: frontend
        run: npm run dead-code
