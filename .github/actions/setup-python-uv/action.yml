name: Setup Python y uv
description: >-
  Unica fuente de las versiones de Python y uv de CI. Antes estaban en el env
  de quality.yml y repetidas a mano en monthly-backup-drill.yml; un bump en un
  lado dejaba atras al otro (C-21). backend/Dockerfile usa las mismas y
  tests/unit/test_workflows_versiones_contract.py lo verifica.

inputs:
  python-version:
    description: Version de Python.
    required: false
    default: "3.14.6"
  uv-version:
    description: Version de uv.
    required: false
    default: "0.11.29"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: ${{ inputs.uv-version }}
