# Snippet compartido de headers de seguridad de la SPA.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: sin esto, cualquier XSS (o dependencia npm comprometida) exfiltra el
# token de sesion. script-src 'self' bloquea scripts inyectados inline;
# style-src necesita 'unsafe-inline' porque la app usa estilos inline de React.
# connect-src 'self' alcanza porque la API se sirve bajo /api del mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
