# Headers de seguridad de la app. En nginx, un `add_header` dentro de un
# `location` DESCARTA los heredados del server, asi que se centralizan en un
# snippet y se incluyen en cada bloque que agregue headers propios.

# Tunel de Sentry: ambos archivos los genera sentry-tunnel.sh en el build de
# la imagen (sin DSN, /sentry-tunnel es un 404 y este include queda vacio).
include /etc/nginx/sentry-tunnel-http.conf;

server {
    server_tokens off;
    listen 3000;
    server_name _;

    client_max_body_size 32k;

    include /etc/nginx/security-headers.conf;

    include /etc/nginx/sentry-tunnel.conf;

    # El HTML se genera en el build desde el shell de Vite. Esta ruta interna
    # hace el lookup por subrequest para que los crawlers reciban los metadatos
    # antes de ejecutar React. La variable conserva el slug validado al reescribir.
    location ~ "^/(?:b|booking)/(?<store_route_slug>[A-Za-z0-9][A-Za-z0-9-]{0,98})/?$" {
        set $share_store_slug $store_route_slug;
        rewrite ^ /store.html last;
    }

    location = /store.html {
        internal;
        root /usr/share/nginx/html;
        ssi on;
        ssi_silent_errors on;
        default_type text/html;

        # Los metadatos dependen de la tienda y nunca deben quedar en una
        # cache compartida o del navegador.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Solo es accesible como subrequest SSI. El nombre del backend se resuelve
    # en runtime por el DNS de Docker; asi `nginx -t` tambien funciona al build.
    location = /_internal/share-metadata {
        internal;
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $share_metadata_upstream backend:8000;
        proxy_pass http://$share_metadata_upstream/public/share-metadata/$arg_slug;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # El shell del SPA (index.html) NO se cachea a ciegas: sin esta cabecera
        # el navegador lo guardaba por heuristica y seguia cargando el manifiesto
        # de chunks viejo despues de un deploy (se vio con /register: el bundle
        # nuevo ya no lo tenia y el browser lo seguia mostrando). no-cache obliga
        # a revalidar con ETag: 304 barato si no cambio, app nueva si cambio.
        add_header Cache-Control "no-cache" always;
        # Repetidos a proposito: add_header en un location descarta los del server.
        include /etc/nginx/security-headers.conf;
    }

    # Assets del build: Vite les pone hash en el nombre, asi que un cambio es
    # un archivo nuevo y se pueden cachear para siempre. Alto volumen: sin log.
    # `^~` corta la busqueda: la regex de abajo no los toca.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        # Un solo Cache-Control (con `expires` salian dos). Sin `always`: un
        # 404 no queda cacheado como inmutable.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repetidos a proposito: el Cache-Control de arriba anularia los del
        # server y los assets JS/CSS quedarian sin nosniff.
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Estaticos SIN hash (favicon-32.png, apple-touch-icon.png... de public/):
    # conservan el nombre entre deploys, asi que nunca immutable; una hora y
    # revalidan.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # El mime.types de nginx 1.30.5 no conoce .webmanifest: sin esto salia como
    # application/octet-stream y, con nosniff, el navegador no lo usaba.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
}
