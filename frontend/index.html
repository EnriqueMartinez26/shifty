<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!-- Iconos generados desde la marca del favicon original (1024 px, 1,4 MB):
         el navegador baja solo el de 32 px; los grandes son para iOS y el manifest. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shifty</title>
    <!-- Solo metatags estaticos: la imagen y la URL de Open Graph esperan el dominio y una imagen de marca (D-20260930-08). -->
    <meta
      name="description"
      content="Shifty es una plataforma para reservar y gestionar turnos online."
    />
    <meta name="theme-color" content="#e67e22" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Shifty" />
    <meta property="og:title" content="Shifty" />
    <meta
      property="og:description"
      content="Shifty es una plataforma para reservar y gestionar turnos online."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
