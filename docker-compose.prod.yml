# Override de PRODUCCION:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Endurece respecto del compose base (que es de desarrollo):
#   - No toca volumenes de codigo: el compose base ya no monta ./backend ni
#     ./frontend y todo corre la imagen construida. Un `volumes: []` aca no
#     quitaria nada, porque compose fusiona las listas (2026-09-24).
#   - Despublica del host los puertos internos (db/redis/rabbitmq/backend/
#     frontend): los servicios se hablan por la red interna. Publicar
#     backend:8000 en loopback permitia, desde el host, saltear nginx y
#     spoofear X-Forwarded-For para evadir el rate limiting.
#   - Agrega el 443 con TLS real (certs montados desde ./nginx/certs).
#   - Define su PROPIO entorno (abajo): antes no tocaba `environment`, asi que
#     los tres procesos heredaban el ancla de desarrollo del compose base
#     (AUD2-C-01, 2026-09-19).
#
# LISTAS: compose FUSIONA las listas del override con las del base (`ports`,
# `volumes`...). Un `ports: []` no quita nada; hasta 2026-09-24 produccion
# seguia publicando todo en 127.0.0.1. Para quitar lo que trae el base se usa
# `!reset []`, que exige Docker Compose >= 2.24 en el servidor (un compose
# anterior no entiende la etiqueta y no levanta). Verificar con
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml config`.
#
# Entorno de PRODUCCION. Dos mitades, y las dos hacen falta:
#
#   1. `env_file: .env` lleva al contenedor TODA clave del .env del operador,
#      incluidas las que ningun ancla lista (COOKIE_SAMESITE, TRUST_PROXY_HEADERS,
#      RATE_LIMIT_FAIL_CLOSED, CELERY_TASK_*, ACCESS_TOKEN_EXPIRE_MINUTES...).
#      Antes se ignoraban en silencio.
#   2. Este bloque repite TODAS las claves del ancla de desarrollo. No alcanza
#      con el env_file: compose le da mas precedencia a `environment` que a
#      `env_file`, y las claves del ancla base se fusionan por clave. La que no
#      se repita aca se queda con el valor de desarrollo.
#
# Las criticas van con `:?`: si falta una, el stack no levanta, en vez de
# arrancar contra la base equivocada. DATABASE_URL, REDIS_URL y el broker salen
# del .env sin cablear los servicios del compose, porque en produccion pueden
# ser administrados. COOKIE_SECURE, EXPOSE_API_DOCS, OTP_PROVIDER y
# OTP_DEBUG_EXPOSE_CODE no pueden traer el valor de desarrollo: como
# apply_production_defaults usa setdefault, un valor explicito de compose le
# gana al default de produccion.
x-app-environment-prod: &app_environment_prod
  ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  VERSION: ${APP_VERSION:?APP_VERSION lo pasa scripts/deploy.sh (ver docs/DEPLOY_RUNBOOK.md); no va en .env}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env (openssl rand -hex 32)}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Falta FIELD_ENCRYPTION_KEY en .env (openssl rand -hex 32)}
  # La app conecta con el rol sin superusuario; las migraciones, con el dueno.
  DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env (rol de la app, ver backend/.env.production.example)}
  MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Falta MIGRATION_DATABASE_URL en .env (rol dueno, con DDL)}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD en .env (openssl rand -hex 32)}
  # F0-15: dos Redis; el de estado no desaloja, el de cache si (ver compose base).
  REDIS_URL: ${REDIS_URL:?Falta REDIS_URL en .env (Redis de ESTADO, noeviction)}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:?Falta REDIS_CACHE_URL en .env (Redis de CACHE, allkeys-lru)}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.5}
  REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-0.5}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Falta CELERY_BROKER_URL en .env}
  CELERY_RESULT_BACKEND_URL: ${CELERY_RESULT_BACKEND_URL:?Falta CELERY_RESULT_BACKEND_URL en .env}
  FRONTEND_URL: ${FRONTEND_URL:?Falta FRONTEND_URL en .env}
  PUBLIC_API_URL: ${PUBLIC_API_URL:?Falta PUBLIC_API_URL en .env}
  MERCADOPAGO_OAUTH_CLIENT_ID: ${MERCADOPAGO_OAUTH_CLIENT_ID:-}
  MERCADOPAGO_OAUTH_CLIENT_SECRET: ${MERCADOPAGO_OAUTH_CLIENT_SECRET:-}
  MERCADOPAGO_OAUTH_REDIRECT_URI: ${MERCADOPAGO_OAUTH_REDIRECT_URI:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
  # Regla 17: sin `*` ni localhost. El arranque lo verifica.
  CORS_ORIGINS: ${CORS_ORIGINS:?Falta CORS_ORIGINS en .env (los origenes del front, sin * ni localhost)}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
  EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
  # `console` esta prohibido en produccion: el arranque lo rechaza.
  OTP_PROVIDER: ${OTP_PROVIDER:?Falta OTP_PROVIDER en .env (console esta prohibido en produccion)}
  OTP_DEBUG_EXPOSE_CODE: ${OTP_DEBUG_EXPOSE_CODE:-false}
  SMTP_HOST: ${SMTP_HOST:?Falta SMTP_HOST en .env}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:?Falta SMTP_USER en .env}
  SMTP_PASS: ${SMTP_PASS:?Falta SMTP_PASS en .env}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:?Falta EMAILS_FROM_EMAIL en .env}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-32768}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  # true: si Redis cae, mejor 503 en auth que quedar sin ningun limite.
  RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-true}
  RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-240}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-12}
  RATE_LIMIT_PUBLIC_READ_PER_MINUTE: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:-120}
  RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE: ${RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE:-20}

# F0-02: en produccion la imagen sale de GHCR con el tag de APP_VERSION, sin
# default. Con `:-dev` un servidor sin APP_VERSION corria cualquier build local
# viejo con ese tag en vez de fallar. APP_VERSION NO va en el .env (quedaria
# vieja despues del primer deploy): la pasa scripts/deploy.sh en cada corrida,
# y un `up` a mano sin ella falla a la vista.
x-app-image-prod: &app_image_prod ghcr.io/enriquemartinez26/shifty-backend:${APP_VERSION:?APP_VERSION lo pasa scripts/deploy.sh (ver docs/DEPLOY_RUNBOOK.md); no va en .env}

services:
  backend:
    image: *app_image_prod
    # Produccion nunca construye: corre lo que CI publico en GHCR. Sin esto un
    # `up` sin --no-build podia construir en el servidor con el tag del release.
    build: !reset null
    env_file:
      - .env
    environment: *app_environment_prod
    ports: !reset []
    # F0-04: tres replicas de UN proceso de uvicorn, no `--workers 3`. Un
    # worker que muere en loop dentro de un contenedor "sano" violaba la
    # regla 21; con replicas cada proceso tiene su healthcheck y su reinicio.
    # nginx reparte entre las tres por el DNS interno de compose.
    deploy:
      replicas: 3

  celery_worker:
    image: *app_image_prod
    env_file:
      - .env
    environment: *app_environment_prod

  celery_worker_interactive:
    image: *app_image_prod
    env_file:
      - .env
    environment: *app_environment_prod

  celery_beat:
    image: *app_image_prod
    env_file:
      - .env
    environment: *app_environment_prod

  frontend:
    build: !reset null
    image: ghcr.io/enriquemartinez26/shifty-frontend:${APP_VERSION:?APP_VERSION lo pasa scripts/deploy.sh (ver docs/DEPLOY_RUNBOOK.md); no va en .env}
    ports: !reset []

  db:
    ports: !reset []
    # F0-20: pg_dump escribe en /backups, un bind al disco del host
    # (BACKUP_DIR): la copia sobrevive a un `down -v` y la toma la copia fuera
    # del host. Compose fusiona por destino: postgres_data sigue montado.
    volumes:
      - pg_backups:/backups
    # F0-14: Postgres para ~4 GB de un VPS de 16 GB. Este `command` REEMPLAZA
    # al del compose base (compose no fusiona `command`), por eso repite
    # shared_preload_libraries y el slow log. log_parameter_max_length=0: el
    # slow log no vuelca los valores de los binds (emails, telefonos). SSD:
    # random_page_cost 1.1 y effective_io_concurrency 200.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=150
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_cost_limit=1000
      - -c
      - log_min_duration_statement=250
      - -c
      - log_parameter_max_length=0
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=0
      - -c
      - log_autovacuum_min_duration=5s
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    # shared_buffers de 1 GB vive en /dev/shm; el default de docker es 64 MB.
    shm_size: 512m
    # Ante falta de memoria en el host, el OOM killer elige otro proceso.
    oom_score_adj: -800
    deploy:
      resources:
        limits:
          memory: 4G

  redis_cache:
    ports: !reset []

  redis_state:
    ports: !reset []

  rabbitmq:
    # F0-16 (decision 6): sin el plugin de management. El 15672 ya no se
    # publica y el plugin cuesta memoria dentro de los 256M.
    image: rabbitmq:3.13.7-alpine
    ports: !reset []

  nginx:
    # El borde corre la imagen OFICIAL con la configuracion montada: no depende
    # del release y no se recrea en cada deploy (se recarga con nginx -s
    # reload). Desarrollo sigue construyendo nginx/Dockerfile.
    image: nginx:1.27.5-alpine
    build: !reset null
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # F0-12 (decision 4): certbot en el host escribe el desafio en
      # ./nginx/acme (--webroot) y el borde lo sirve en
      # /.well-known/acme-challenge/ desde /var/www/acme.
      - ./nginx/acme:/var/www/acme:ro

volumes:
  # F0-20: directorio del host para los backups de la base. Tiene que existir
  # antes del `up` (un volumen local con `o: bind` no lo crea).
  pg_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_DIR:-/var/backups/shifty}
