# Configuracion de PRODUCCION del edge: TLS terminado aca, HTTP solo redirige.
# Requiere montar los certificados (ver docker-compose.prod.yml). Si TLS lo
# termina un proveedor externo (Cloudflare/ALB), ese proveedor debe forzar
# HTTPS + HSTS y REESCRIBIR X-Forwarded-For; este archivo queda como referencia.

# Va a conf.d, que el nginx.conf de la imagen incluye DENTRO de `http {}`: lo
# que esta fuera de `server` es de nivel http. Misma estructura que el edge de
# desarrollo (nginx.conf); el contrato de ambos vive en
# backend/tests/unit/test_nginx_contract.py.

# Sin version de nginx en headers ni paginas de error, en todos los server.
server_tokens off;

# DNS interno de Docker. Con `resolve` en los upstreams, nginx sigue las IP
# de los contenedores sin reload (un recreate cambia la IP) y reparte entre
# TODOS los registros A del servicio (replicas del backend).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone upstream_api 64k;
    server backend:8000 resolve;
    keepalive 32;
    # Menor que el keep-alive de uvicorn (5 s): nginx suelta la conexion
    # antes de que uvicorn la cierre, o el reuso termina en 502.
    keepalive_timeout 4s;
}

upstream spa {
    zone upstream_spa 64k;
    server frontend:3000 resolve;
    keepalive 8;
}

# Texto comprimido tambien si viene del backend o de la SPA (`any`). Nunca
# image/* salvo svg: png/jpg/webp ya vienen comprimidos. /api/auth/ lo apaga.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

# Rate limit del edge por IP: solo corta inundaciones. El limite fino (por
# ruta y por sujeto, con Retry-After) es el de core/rate_limit.py.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    # Nada se sirve en claro: ni la app ni la API.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:shifty_ssl:10m;
    ssl_session_tickets off;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    limit_conn perip 40;

    # Con el default (8 x 4k) toda respuesta > 32 KB (la disponibilidad
    # incluida) se volcaba a un archivo temporal antes de salir.
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://spa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Reescribir, NUNCA agregar ($proxy_add_x_forwarded_for): el primer
        # elemento del header lo controla el cliente y el rate limiting del
        # backend se evadia eligiendo la "IP".
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subida de imagenes de tienda (logo/portada): unico endpoint multipart, con
    # un limite de cuerpo mayor. Mas especifico que /api/, asi que gana.
    location = /api/stores/me/media {
        limit_req zone=api burst=40 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        # La app acepta 3 MiB (MAX_UPLOAD_BODY_BYTES) y el multipart agrega
        # encabezados: con 3m el edge cortaba antes que la app.
        client_max_body_size 3200k;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login, refresh y reset devuelven secretos: sin gzip (BREACH, el tamanio
    # de una respuesta comprimida filtra el secreto que refleja).
    location /api/auth/ {
        gzip off;
        limit_req zone=auth burst=6 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        client_max_body_size 32k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        client_max_body_size 32k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Errores que genera el edge para /api, en el sobre canonico de la app
    # (regla 23: HTML hacia /api rompe el front). `types {}` vacio: el
    # Content-Type no sale de la extension de la URI. Los add_header del
    # server se repiten: uno propio descarta los heredados.

    # Backend caido, reiniciando o sin responder a tiempo (lo genera nginx;
    # un 503 que devuelve la app pasa tal cual: proxy_intercept_errors off).
    location @api_down {
        types { }
        default_type "application/json; charset=utf-8";
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 503 '{"success":false,"error_code":"UPSTREAM_UNAVAILABLE","message":"El servicio no está disponible. Intentá nuevamente en unos segundos."}';
    }

    # Mismo error_code que el tope de cuerpo de la app (security_middleware).
    location @request_too_large {
        types { }
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 413 '{"success":false,"error_code":"REQUEST_TOO_LARGE","message":"El cuerpo del request supera el límite permitido"}';
    }

    # limit_req/limit_conn del edge. Mismo sobre que el limitador de la app.
    location @rate_limited {
        types { }
        default_type "application/json; charset=utf-8";
        add_header Retry-After 1 always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 429 '{"success":false,"error_code":"RATE_LIMITED","message":"Demasiadas solicitudes. Intentá nuevamente más tarde."}';
    }

    # Sin /docs ni /openapi.json en produccion: EXPOSE_API_DOCS ya va en false,
    # y no exponemos ni siquiera el proxy.
}
