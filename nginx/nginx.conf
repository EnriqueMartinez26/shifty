# Edge de DESARROLLO. Misma estructura que nginx.prod.conf (sin TLS); el
# contrato de ambos vive en backend/tests/unit/test_nginx_contract.py.
# Este archivo va a conf.d, que el nginx.conf de la imagen incluye DENTRO de
# `http {}`: lo que esta fuera de `server` es de nivel http.

# Sin version de nginx en headers ni paginas de error, en todos los server.
server_tokens off;

# DNS interno de Docker. Con `resolve` en los upstreams, nginx sigue las IP
# de los contenedores sin reload (un recreate cambia la IP) y reparte entre
# TODOS los registros A del servicio (replicas del backend).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone upstream_api 64k;
    server backend:8000 resolve;
    keepalive 32;
    # Menor que el keep-alive de uvicorn (5 s): nginx suelta la conexion
    # antes de que uvicorn la cierre, o el reuso termina en 502.
    keepalive_timeout 4s;
}

upstream spa {
    zone upstream_spa 64k;
    server frontend:3000 resolve;
    keepalive 8;
}

# Texto comprimido tambien si viene del backend o de la SPA (`any`). Nunca
# image/* salvo svg: png/jpg/webp ya vienen comprimidos. /api/auth/ lo apaga.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

# Rate limit del edge por IP: solo corta inundaciones. El limite fino (por
# ruta y por sujeto, con Retry-After) es el de core/rate_limit.py.
# Desarrollo: mas laxo que prod (las simulaciones locales salen de una
# sola IP), nunca mas estricto.
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/s;
# Webhook de Mercado Pago: MP reintenta en rafaga desde pocas IP; con la
# zona `api` podia recibir 429 antes de que la app verifique el HMAC.
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;
# Cada rechazo es una linea del error log: warn (una inundacion no es un
# error del servidor). El error log de nginx imprime la linea de request
# COMPLETA, query incluida (client_phone), en rechazos y en errores de
# upstream, y su formato no se puede cambiar: su retencion tiene que ser
# corta (ver la operacion de logs).
limit_req_log_level warn;
limit_conn_log_level warn;

# Access log en JSON, una linea por request. `$uri` y nunca `$request` ni
# `$request_uri`: la query lleva client_phone en la reserva publica. Ojo: en
# /api, `$uri` es el ya reescrito (sin el prefijo /api). `rid` es el
# X-Edge-Request-Id que recibe el backend. `s`, `urt` y `uct` van entre
# comillas: $status vale 000 si el cliente corta antes de la respuesta y
# los tiempos del upstream salen vacios (sin upstream), "-" o
# "0.010, 0.020" (reintento); quien mida latencias parsea `urt` como
# texto, no como numero.
log_format shifty_json escape=json
    '{"t":"$time_iso8601","rid":"$request_id","m":"$request_method",'
    '"u":"$uri","s":"$status","rt":$request_time,'
    '"urt":"$upstream_response_time","uct":"$upstream_connect_time",'
    '"ip":"$remote_addr","ua":"$http_user_agent","bytes":$body_bytes_sent}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log shifty_json;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    limit_conn perip 400;

    # Con el default (8 x 4k) toda respuesta > 32 KB (la disponibilidad
    # incluida) se volcaba a un archivo temporal antes de salir.
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # El contenedor frontend sirve el build estatico (no hay Vite ni HMR
    # detras), asi que no hace falta el upgrade a WebSocket.
    location / {
        proxy_pass http://spa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Id del edge para correlacionar con el log. NUNCA X-Request-ID: Mercado
        # Pago firma el webhook con el suyo (manifest HMAC de payments/router.py).
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    # Assets con hash del build: inmutables y de alto volumen, sin log.
    location ^~ /assets/ {
        access_log off;
        proxy_pass http://spa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    # Subida de imagenes de tienda (logo/portada): unico endpoint multipart, con
    # un limite de cuerpo mayor. Mas especifico que /api/, asi que gana.
    location = /api/stores/me/media {
        limit_req zone=api burst=400 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        # La app acepta 3 MiB (MAX_UPLOAD_BODY_BYTES) y el multipart agrega
        # encabezados: con 3m el edge cortaba antes que la app.
        client_max_body_size 3200k;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    # Login, refresh y reset devuelven secretos: sin gzip (BREACH, el tamanio
    # de una respuesta comprimida filtra el secreto que refleja).
    location /api/auth/ {
        gzip off;
        limit_req zone=auth burst=60 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        client_max_body_size 32k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    # Webhook de Mercado Pago: mismo proxy que /api/, con zona propia para que
    # una rafaga de reintentos no reciba 429 antes de verificar el HMAC.
    location = /api/payments/webhooks/mercadopago {
        limit_req zone=webhooks burst=600 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        client_max_body_size 32k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    location /api/ {
        limit_req zone=api burst=400 nodelay;
        error_page 502 503 504 = @api_down;
        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        client_max_body_size 32k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Reescribe /api/something a /something para el backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    # Errores que genera el edge para /api, en el sobre canonico de la app
    # (regla 23: HTML hacia /api rompe el front). `types {}` vacio: el
    # Content-Type no sale de la extension de la URI. Los add_header del
    # server se repiten: uno propio descarta los heredados.

    # Backend caido, reiniciando o sin responder a tiempo (lo genera nginx;
    # un 503 que devuelve la app pasa tal cual: proxy_intercept_errors off).
    location @api_down {
        types { }
        default_type "application/json; charset=utf-8";
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 503 '{"success":false,"error_code":"UPSTREAM_UNAVAILABLE","message":"El servicio no está disponible. Intentá nuevamente en unos segundos."}';
    }

    # Mismo error_code que el tope de cuerpo de la app (security_middleware).
    location @request_too_large {
        types { }
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 413 '{"success":false,"error_code":"REQUEST_TOO_LARGE","message":"El cuerpo del request supera el límite permitido"}';
    }

    # limit_req/limit_conn del edge. Mismo sobre que el limitador de la app.
    location @rate_limited {
        types { }
        default_type "application/json; charset=utf-8";
        add_header Retry-After 1 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 429 '{"success":false,"error_code":"RATE_LIMITED","message":"Demasiadas solicitudes. Intentá nuevamente más tarde."}';
    }

    # Documentación de la API (Swagger/Redoc)
    location /docs {
        client_max_body_size 64k;
        proxy_pass http://api/docs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }

    location /openapi.json {
        client_max_body_size 64k;
        proxy_pass http://api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Edge-Request-Id $request_id;
    }
}
