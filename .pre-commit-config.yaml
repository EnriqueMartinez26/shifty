# Compuerta de pre-commit del repo. HOY NO ESTA ACTIVA (C-22, 2026-09-19).
#
# Como se activa, por clon:
#
#     uv run pre-commit install
#
# Antes de activarla hay dos cosas que resolver:
#
# 1. Alinear el toolchain de Node. `.githooks/verify-toolchain` (el primer
#    hook de abajo) acepta solo el conjunto soportado: Node 24.18.0 o 26.5.0
#    (npm 11.16.0 u 11.17.0), que es lo que usan CI y el carril de compat.
#    Una maquina con otra version -- 24.16.0, por ejemplo -- queda afuera y,
#    con la compuerta activa, TODOS los commits quedan bloqueados. Ademas
#    `npm ci` necesita `--engine-strict=false` en esa situacion.
# 2. Elegir UNA compuerta. `.githooks/pre-commit` hace lo mismo que este
#    archivo pero se activa con `git config core.hooksPath .githooks`, y eso
#    deja de mirar `.git/hooks/`, que es justamente donde escribe
#    `pre-commit install`: activar una desactiva la otra. Mientras no se
#    elija, las dos conviven sin correr.
#
# Tiempos medidos en el backend (2026-09-19) para que la compuerta no sea
# insoportable: mypy tarda 32 s la primera vez y 1,8 s con cache, asi que
# queda adentro; ruff es inmediato.
#
# Lo que corre aca es lo mismo que el gate de CLAUDE.md §6: ruff format
# --check, ruff check y mypy en el backend, y los cuatro pasos de
# `npm run check` en el front.
minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: verify-toolchain
        name: verify exact development toolchain
        entry: sh .githooks/verify-toolchain
        language: system
        pass_filenames: false
      - id: frontend-format-check
        name: frontend prettier check
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
      - id: backend-ruff-format-check
        name: backend ruff format check
        entry: uv run --project backend ruff format --check backend
        language: system
        pass_filenames: false
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --project backend ruff check backend
        language: system
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: frontend eslint strict
        entry: npm --prefix frontend run lint:strict
        language: system
        pass_filenames: false
      - id: frontend-dead-code
        name: frontend dead code
        entry: npm --prefix frontend run dead-code
        language: system
        pass_filenames: false
      - id: backend-mypy
        name: backend mypy
        entry: bash -lc 'cd backend && uv run mypy .'
        language: system
        pass_filenames: false
