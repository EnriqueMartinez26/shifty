minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: verify-toolchain
        name: verify exact development toolchain
        entry: sh .githooks/verify-toolchain
        language: system
        pass_filenames: false
      - id: frontend-format-check
        name: frontend prettier check
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
      - id: backend-ruff-format-check
        name: backend ruff format check
        entry: uv run --project backend ruff format --check backend
        language: system
        pass_filenames: false
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --project backend ruff check backend
        language: system
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: frontend eslint strict
        entry: npm --prefix frontend run lint:strict
        language: system
        pass_filenames: false
      - id: frontend-dead-code
        name: frontend dead code
        entry: npm --prefix frontend run dead-code
        language: system
        pass_filenames: false
      - id: backend-mypy
        name: backend mypy
        entry: bash -lc 'cd backend && uv run mypy .'
        language: system
        pass_filenames: false
