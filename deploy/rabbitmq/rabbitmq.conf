# Configuracion de RabbitMQ para el stack de Shifty (plan de rendimiento F0-16).
# Se monta de solo lectura en /etc/rabbitmq/conf.d/10-shifty.conf desde
# docker-compose.yml; la imagen oficial lee todo conf.d al arrancar.

# Alarma de memoria ABSOLUTA. Por defecto es el 40% de la RAM que RabbitMQ ve,
# que dentro de un contenedor es la del host: con 16 GB la alarma llegaba a
# ~6 GB y el limite de 256 MB del contenedor lo mataba por OOM antes. Con la
# alarma activa RabbitMQ bloquea a los publicadores hasta que baje la memoria.
vm_memory_high_watermark.absolute = 180MiB

# Con menos de 1 GB libre en disco, RabbitMQ tambien bloquea a los
# publicadores en vez de llenar el disco del host.
disk_free_limit.absolute = 1GB
