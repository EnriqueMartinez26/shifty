[project]
name = "shifty-backend"
version = "0.1.0"
description = "Backend for Shifty v2 - Appointment Management SaaS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "redis>=8.0.1",
    "celery>=5.3.0",
    "python-ulid>=3.0.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.4.1",
    "httpx>=0.27.0",
    "sentry-sdk[celery,fastapi,sqlalchemy]>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "factory-boy>=3.3.0",
    "ruff>=0.3.0",
    "mypy>=2.3.0",
    "locust>=2.24.0",
    "ipython>=8.22.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = [
    "F401",
    "F811",
    "TID251",
]
ignore = [
    "E712",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException".msg = "Use custom exceptions from core.exceptions instead of raw HTTPException."
"fastapi.exceptions.HTTPException".msg = "Use custom exceptions from core.exceptions instead of raw HTTPException."

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"main.py" = ["E402"]
"modules/appointments/router.py" = ["E402"]
"modules/appointments/model.py" = ["F401"]
"modules/staff/model.py" = ["F401"]
"modules/users/model.py" = ["F401"]
"run_migrations.py" = ["E402"]
"scripts/bootstrap_superadmin.py" = ["E402"]
"scripts/seed_simulation.py" = ["E402"]
"tests/**/*.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
# El proyecto no declara [build-system], por lo que uv no instala `core`/`main`
# como paquete importable. Sin esto, `uv run pytest` (invocacion usada por CI)
# falla con ModuleNotFoundError al importar el conftest. `pythonpath` agrega la
# raiz del backend al sys.path de forma explicita e independiente del cwd.
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: tests that exercise API or database integration boundaries",
]
